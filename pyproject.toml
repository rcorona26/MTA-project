[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mta-delay-prediction"
version = "0.1.0"
description = "Reproducible MTA service-alert ingestion and line-hour target construction"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
mta-alerts = "mta_delay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
